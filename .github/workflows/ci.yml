name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # The release workflow runs these jobs on the commit it is about to tag.
  workflow_call:
    inputs:
      ref:
        description: The commit to check
        type: string
        required: true
      version:
        description: The version the commit is released as, X.Y.Z
        type: string
        required: true

permissions:
  contents: read

# bash with pipefail, so that a step whose pipe fails part of the way fails.
defaults:
  run:
    shell: bash

jobs:
  # composer.json, PHPStan and the tests on the oldest PHP composer.json takes and on the newest.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [oldest, '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # composer.json and this are one statement, so the oldest is read there: a version written
      # here as well would let the tests pass on a PHP the package no longer takes.
      - name: The PHP to run on
        id: php
        run: |
          if [ "${{ matrix.php }}" != oldest ]; then
            echo "version=${{ matrix.php }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          required=$(jq -r '.require.php' composer.json)
          if [[ ! "$required" =~ ^\^([0-9]+\.[0-9]+)$ ]]; then
            echo "::error::composer.json requires PHP $required; write the oldest it takes as ^X.Y"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      # Without intl, bcmath and gmp, so that code that asked one would fail here; raoh-php and
      # notation-199x need none. PHPUnit needs mbstring, so that stays.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php.outputs.version }}
          extensions: :intl, :bcmath, :gmp
          coverage: none
      # composer.lock is not committed: a library is installed with the versions its users resolve.
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock
      - name: Install
        run: composer install --no-progress
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      # The suite at the commit conformance/spec.lock pins, where scripts/conformance.sh would clone
      # it, which .gitignore leaves out.
      - name: The pinned revision of the specification
        id: spec
        run: |
          echo "repository=$(jq -er .repository conformance/spec.lock)" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -er .revision conformance/spec.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.spec.outputs.repository }}
          ref: ${{ steps.spec.outputs.revision }}
          path: conformance/target/raoh-specification
      # The tests that read the suite fail here rather than skip where it cannot be read.
      - name: Test
        env:
          RAOH_SPECIFICATION_DIR: conformance/target/raoh-specification
          RAOH_REQUIRE_SPECIFICATION: '1'
        run: vendor/bin/phpunit

  # The cases of the Raoh Specification at the commit conformance/spec.lock pins, run on this
  # library and checked by that commit's raoh-verify against conformance/conformance.json.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: The pinned revision of the specification
        id: spec
        run: |
          echo "repository=$(jq -er .repository conformance/spec.lock)" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -er .revision conformance/spec.lock)" >> "$GITHUB_OUTPUT"
      # Where scripts/conformance.sh would clone it; the script checks it is at the pinned commit.
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.spec.outputs.repository }}
          ref: ${{ steps.spec.outputs.revision }}
          path: conformance/target/raoh-specification
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: :intl, :bcmath, :gmp
          coverage: none
      # The verifier is built with the Go its own go.mod names.
      - uses: actions/setup-go@v7
        with:
          go-version-file: conformance/target/raoh-specification/go.mod
          cache-dependency-path: conformance/target/raoh-specification/go.sum
      - name: Install
        run: composer install --no-progress
      - run: scripts/conformance.sh
        env:
          RAOH_PHP_VERSION: ${{ inputs.version }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance
          path: |
            conformance/target/runner-result.json
            conformance/target/conformance-report.json
          if-no-files-found: ignore
